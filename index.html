<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#24243e">
<link rel="manifest" href="manifest.json">
<title>Heads Up!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* html/body 作为 root canvas 直接承载渐变背景。
     height: 100% 建立确定高度体系，使 .screen 的 min-height: 100% 有可靠参照，
     游戏页 #game 才能撑满视口并垂直居中单词。
     关键：iOS 中 background-color（纯色）会铺满整个画布（含底部 Home Indicator 安全区），
     而 background-image（渐变）只在元素盒内。渐变已改为垂直方向（底部整行 = 末尾色），
     因此用 background-color 设为渐变末尾色兜底，安全区即显示与渐变底部一致的颜色，无缝衔接。 */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-image: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    background-color: #24243e;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  /* 页面布局层：min-height 撑满视口，背景透明透出 html/body 渐变。
     position: relative 作为内部 absolute 元素（topbar/hint）的定位参照。 */
  .screen {
    position: relative;
    min-height: 100%;
    background: transparent;
    display: flex;
    flex-direction: column;
    transition: opacity .25s ease;
    touch-action: manipulation;
  }
  .screen.hidden { display: none; }

  /* ============ 首页 ============ */
  #home {
    /* UI 层背景透明，透出 html/body 渐变；padding 仅用于内容避开 safe-area */
    background: transparent;
    padding: calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 30px);
    overflow-y: auto;
  }
  #home .title {
    text-align: center;
    color: #fff;
  }
  #home .title h1 {
    font-size: 9vh;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 4px 30px rgba(0,0,0,.5);
    background: linear-gradient(90deg, #ffd86f, #fc6262, #a18cd1, #ffd86f);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine {
    0% { background-position: 0% 0; }
    100% { background-position: 300% 0; }
  }
  #home .title .version {
    margin-top: 8px;
    margin-bottom: 42px;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.45);
    font-weight: 600;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 14px;
    max-width: 560px;
    margin: 0 auto;
  }
  .card {
    position: relative;
    border: none;
    border-radius: 18px;
    padding: 22px 10px 16px;
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s ease;
    aspect-ratio: 1 / 1;
    width: calc(50% - 7px);
    flex: 0 0 calc(50% - 7px);
    max-width: 268px;
  }
  .card:active { transform: scale(.94); }
  .card .emoji { font-size: 34px; line-height: 1; }
  .card .name { font-size: 18px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .card .count { font-size: 11px; opacity: .85; font-weight: 500; }
  .card.random {
    background: linear-gradient(150deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    width: 100%;
    flex: 1 1 100%;
    aspect-ratio: auto;
    padding: 20px;
    flex-direction: row;
    gap: 12px;
  }
  .card.random .emoji { font-size: 30px; }
  .card.random .name { font-size: 22px; }

  /* ============ 游戏页 ============ */
  #game {
    justify-content: center;
    align-items: center;
    cursor: pointer;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px);
  }
  #game .topbar {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 14px);
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    pointer-events: none;
  }
  #back {
    pointer-events: auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.4);
    background: rgba(0,0,0,.25);
    color: #fff;
    font-size: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    cursor: pointer;
  }
  #back:active { transform: scale(.9); }
  #cat-label {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgba(255,255,255,.92);
    background: rgba(0,0,0,.22);
    padding: 6px 14px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
    white-space: nowrap;
  }

  #word-wrap { display: flex; justify-content: center; align-items: center; width: 100%; }
  #word {
    color: #fff;
    font-weight: 900;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.3;
    text-shadow:
      0 2px 0 rgba(0,0,0,.18),
      0 6px 24px rgba(0,0,0,.4);
    transition: opacity .18s ease, transform .18s ease;
    max-width: 92%;
    word-break: break-all;
  }
  #word.out { opacity: 0; transform: translateY(-24px) scale(.92); }
  #word.in { opacity: 0; transform: translateY(24px) scale(.92); }
  /* 换词后的单次抖动动画 */
  #word.shake {
    animation: word-shake .35s ease;
  }
  @keyframes word-shake {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-6px); }
    40%  { transform: translateX(6px); }
    60%  { transform: translateX(-4px); }
    80%  { transform: translateX(4px); }
    100% { transform: translateX(0); }
  }

  #hint {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 22px);
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,.85);
    text-shadow: 0 1px 6px rgba(0,0,0,.4);
    letter-spacing: 1px;
    pointer-events: none;
  }

  @media (orientation: landscape) {
    /* 横屏时 Home Indicator 位于屏幕左右侧，UI 内容需避让 safe-area；
       html/body 渐变背景仍由 root canvas 绘制，不参与避让 */
    #home .grid { max-width: 900px; }
    #home {
      padding-top: calc(env(safe-area-inset-top) + 24px);
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }
    #game {
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }
    #home .title h1 { font-size: 8vh; }
    .card { aspect-ratio: 4 / 3; width: calc(25% - 10.5px); flex: 0 0 calc(25% - 10.5px); }
    .card.random { width: 100%; flex: 1 1 100%; aspect-ratio: auto; }
    #word { letter-spacing: 1px; }
  }
</style>
</head>
<body>

  <!-- ============ 首页 ============ -->
  <div id="home" class="screen">
    <div class="title">
      <h1>Heads Up!</h1>
      <p class="version">v1.2.2</p>
    </div>
    <div class="grid" id="grid"></div>
  </div>

    <div class="topbar">

    </div>
    <div id="word-wrap">

    </div>
    <div id="hint">点击屏幕换下一个词</div>

/* ================= 工具 ================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

    '<span class="count">' + cat.words.length + " 个词</span>";
  btn.addEventListener("click", () => startGame(cat));
  gridEl.appendChild(btn);
});

randomCard.addEventListener("click", () => {
  /* 随机模式：把所有品类的所有词混合洗牌，每个词都携带所属品类的背景渐变 */
  const all = [];
  CATEGORIES.forEach(function (cat) {
    cat.words.forEach(function (w) {
      all.push({ word: w, gradient: cat.gradient });
    });
  });
  startGame(null, shuffle(all));
});

/* ================= 背景 ================= */

const HOME_GRADIENT = "linear-gradient(150deg, #0f0c29 0%, #302b63 50%, #24243e 100%)";

/* 从垂直渐变中提取末尾色，作为 background-color 兜底 Home Indicator 安全区。
   渐变是垂直方向，底部整行都是该末尾色，故与兜底色无缝衔接。 */
function gradientFallback(gradient) {
  const m = gradient.match(/#[0-9a-fA-F]{3,6}\s+100%/i);
  if (m) return m[0].trim().split(/\s+/)[0];
  const colors = gradient.match(/#[0-9a-fA-F]{3,6}/gi);
  return colors ? colors[colors.length - 1] : "#24243e";
}

/* 同步渐变到 html + body（root canvas）：
   - background-image：完整渐变（主体显示）
   - background-color：渐变末尾色（铺满画布，兜底底部安全区，颜色与渐变底部无缝一致） */
function setScreenBg(gradient) {
  const fallback = gradientFallback(gradient);
  document.documentElement.style.backgroundImage = gradient;
  document.documentElement.style.backgroundColor = fallback;
  document.body.style.backgroundImage = gradient;
  document.body.style.backgroundColor = fallback;
}

/* 初始化首页背景 */
setScreenBg(HOME_GRADIENT);

function startGame(cat, customDeck) {
  if (customDeck) {
    /* 随机模式：使用跨品类混洗的词组，标签标记为随机 */
    deck = customDeck;
    catLabelEl.textContent = "🎲 随机开玩";
  } else {
    deck = shuffle(cat.words.map(function (w) {
      return { word: w, gradient: cat.gradient };
    }));
    catLabelEl.textContent = cat.emoji + " " + cat.name;
  }
  deckIndex = 0;
  /* 进入时根据首个词所属品类设置背景 */
  setScreenBg(deck[0].gradient);
  showWord(true);
  homeEl.classList.add("hidden");
  gameEl.classList.remove("hidden");
}

function nextWord() {
  deckIndex++;
  if (deckIndex >= deck.length) {
    deck = shuffle(deck);
    deckIndex = 0;
  }
  showWord(false);
}

function showWord(instant) {
  wordEl.classList.remove("shake"); /* 清除上一次抖动，避免干扰本次淡入淡出动画 */
  wordEl.classList.add("out");
  window.setTimeout(() => {
    /* 换词时同步背景为当前词所属品类的渐变 */
    setScreenBg(deck[deckIndex].gradient);
    wordEl.textContent = deck[deckIndex].word;
    fitWord(deck[deckIndex].word);
    if (instant) {
      wordEl.classList.remove("out");
      triggerWordFeedback();
    } else {
      wordEl.classList.remove("out");
      wordEl.classList.add("in");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        wordEl.classList.remove("in");
        /* 等淡入完成后再做音效与单次抖动 */
        triggerWordFeedback();
      }));
    }
  }, instant ? 0 : 160);
}

/* 换词反馈：播放短促音效 + 单词单次抖动 */
function triggerWordFeedback() {
  playTick();
  wordEl.classList.remove("shake");
  void wordEl.offsetWidth; /* 强制 reflow，确保动画可重新触发 */
  wordEl.classList.add("shake");
}

/* 用 Web Audio API 生成一个短促的"嗒"声，无需音频文件 */
let audioCtx = null;
function playTick() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(440, t + 0.08);
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.11);
  } catch (e) { /* 静默忽略音频异常 */ }
}

function fitWord(w) {
  const len = w.length;
  let size;
  if (len <= 2) size = 26;
  else if (len <= 4) size = 19;
  else if (len <= 6) size = 15;
  else if (len <= 8) size = 12;
  else size = 10;
  wordEl.style.fontSize = size + "vmin";
}

/* ================= 事件 ================= */
document.getElementById("back").addEventListener("click", (e) => {
  e.stopPropagation();
  gameEl.classList.add("hidden");
  homeEl.classList.remove("hidden");
  /* 返回首页时恢复首页渐变背景 */
  setScreenBg(HOME_GRADIENT);
});

gameEl.addEventListener("click", nextWord);
</script>
</body>
</html>
