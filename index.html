<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Heads Up!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  body { background: #12101f; }

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    transition: opacity .25s ease;
    touch-action: manipulation;
  }
  .screen.hidden { display: none; }

  /* ============ 首页 ============ */
  #home {
    background: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    padding: calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 30px);
    overflow-y: auto;
  }
  #home .title {
    text-align: center;
    color: #fff;
  }
  #home .title h1 {
    font-size: 9vh;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 4px 30px rgba(0,0,0,.5);
    background: linear-gradient(90deg, #ffd86f, #fc6262, #a18cd1, #ffd86f);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine {
    0% { background-position: 0% 0; }
    100% { background-position: 300% 0; }
  }
  #home .title p {
    margin-top: 8px;
    font-size: 14px;
    color: rgba(255,255,255,.75);
    font-weight: 500;
  }
  #home .howto {
    margin: 18px auto 22px;
    max-width: 520px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    padding: 12px 16px;
    color: rgba(255,255,255,.9);
    font-size: 13px;
    line-height: 1.9;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  #home .howto b { color: #ffd86f; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    max-width: 560px;
    margin: 0 auto;
  }
  .card {
    position: relative;
    border: none;
    border-radius: 18px;
    padding: 22px 10px 16px;
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .15s ease;
    aspect-ratio: 1 / 1;
  }
  .card:active { transform: scale(.94); }
  .card .emoji { font-size: 34px; line-height: 1; }
  .card .name { font-size: 18px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .card .count { font-size: 11px; opacity: .85; font-weight: 500; }
  .card.random {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    grid-column: 1 / -1;
    aspect-ratio: auto;
    padding: 20px;
    flex-direction: row;
    gap: 12px;
  }
  .card.random .emoji { font-size: 30px; }
  .card.random .name { font-size: 22px; }

  /* ============ 游戏页 ============ */
  #game {
    justify-content: center;
    align-items: center;
    cursor: pointer;
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px);
  }
  #game .topbar {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 14px);
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    pointer-events: none;
  }
  #back {
    pointer-events: auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.4);
    background: rgba(0,0,0,.25);
    color: #fff;
    font-size: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    cursor: pointer;
  }
  #back:active { transform: scale(.9); }
  #cat-label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgba(255,255,255,.92);
    background: rgba(0,0,0,.22);
    padding: 6px 14px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  #played-count {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,.95);
    background: rgba(0,0,0,.22);
    padding: 6px 14px;
    border-radius: 20px;
    backdrop-filter: blur(4px);
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
    min-width: 58px;
    text-align: center;
  }

  #word-wrap { display: flex; justify-content: center; align-items: center; width: 100%; }
  #word {
    color: #fff;
    font-weight: 900;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.3;
    text-shadow:
      0 2px 0 rgba(0,0,0,.18),
      0 6px 24px rgba(0,0,0,.4);
    transition: opacity .18s ease, transform .18s ease;
    max-width: 92%;
    word-break: break-all;
  }
  #word.out { opacity: 0; transform: translateY(-24px) scale(.92); }
  #word.in { opacity: 0; transform: translateY(24px) scale(.92); }

  #hint {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 22px);
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,.85);
    text-shadow: 0 1px 6px rgba(0,0,0,.4);
    letter-spacing: 1px;
    pointer-events: none;
  }

  @media (orientation: landscape) {
    #home .grid { grid-template-columns: repeat(4, 1fr); max-width: 900px; }
    #home { padding-top: calc(env(safe-area-inset-top) + 24px); }
    #home .title h1 { font-size: 8vh; }
    .card { aspect-ratio: 4 / 3; }
    .card.random { grid-column: 1 / -1; aspect-ratio: auto; }
    #word { letter-spacing: 1px; }
  }
</style>
</head>
<body>

  <!-- ============ 首页 ============ -->
  <div id="home" class="screen">
    <div class="title">
      <h1>Heads Up!</h1>
      <p>举着手机 · 你说我猜 · 换词不停</p>
    </div>
    <div class="howto">
      <b>玩法：</b>手机屏幕朝外举在额头上<br>
      <b>换词：</b>点击 / 双击屏幕任意处<br>
      <b>退出：</b>左上角 ← 按钮随时返回
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- ============ 游戏页 ============ -->
  <div id="game" class="screen hidden">
    <div class="topbar">
      <button id="back" aria-label="返回">‹</button>
      <span id="cat-label"></span>
      <span id="played-count">0 个</span>
    </div>
    <div id="word-wrap">
      <div id="word"></div>
    </div>
    <div id="hint">点击屏幕换下一个词</div>
  </div>

/* ================= 工具 ================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ================= DOM ================= */
const homeEl = document.getElementById("home");
const gameEl = document.getElementById("game");
const gridEl = document.getElementById("grid");
const wordEl = document.getElementById("word");
const catLabelEl = document.getElementById("cat-label");
const playedEl = document.getElementById("played-count");

/* ================= 首页渲染 ================= */
const randomCard = document.createElement("button");
randomCard.className = "card random";
randomCard.innerHTML = '<span class="emoji">🎲</span><span class="name">随机开玩</span>';
gridEl.appendChild(randomCard);

CATEGORIES.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "card";
  btn.style.background = cat.gradient;
  btn.innerHTML =
    '<span class="emoji">' + cat.emoji + "</span>" +
    '<span class="name">' + cat.name + "</span>" +
    '<span class="count">' + cat.words.length + " 个词</span>";
  btn.addEventListener("click", () => startGame(cat));
  gridEl.appendChild(btn);
});

randomCard.addEventListener("click", () => {
  const cat = CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)];
  startGame(cat);
});

/* ================= 游戏逻辑 ================= */
let deck = [];
let deckIndex = 0;
let playedCount = 0;

function startGame(cat) {
  deck = shuffle(cat.words);
  deckIndex = 0;
  playedCount = 0;
  gameEl.style.background = cat.gradient;
  catLabelEl.textContent = cat.emoji + " " + cat.name;
  updatePlayed();
  showWord(true);
  homeEl.classList.add("hidden");
  gameEl.classList.remove("hidden");
}

function nextWord() {
  deckIndex++;
  if (deckIndex >= deck.length) {
    deck = shuffle(deck);
    deckIndex = 0;
  }
  playedCount++;
  updatePlayed();
  showWord(false);
}

function showWord(instant) {
  wordEl.classList.add("out");
  window.setTimeout(() => {
    wordEl.textContent = deck[deckIndex];
    fitWord(deck[deckIndex]);
    if (instant) {
      wordEl.classList.remove("out");
    } else {
      wordEl.classList.remove("out");
      wordEl.classList.add("in");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        wordEl.classList.remove("in");
      }));
    }
  }, instant ? 0 : 160);
}

function fitWord(w) {
  const len = w.length;
  let size;
  if (len <= 2) size = 26;
  else if (len <= 4) size = 19;
  else if (len <= 6) size = 15;
  else if (len <= 8) size = 12;
  else size = 10;
  wordEl.style.fontSize = size + "vmin";
}

function updatePlayed() {
  playedEl.textContent = playedCount + " 个";
}

/* ================= 事件 ================= */
document.getElementById("back").addEventListener("click", (e) => {
  e.stopPropagation();
  gameEl.classList.add("hidden");
  homeEl.classList.remove("hidden");
});

gameEl.addEventListener("click", nextWord);
</script>
</body>
</html>
